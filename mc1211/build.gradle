plugins {
	id 'net.fabricmc.fabric-loom-remap' version '1.14-SNAPSHOT'
	id 'maven-publish'
}

def minecraftVersion = '1.21.1'
def loaderVersion = '0.15.11'
def fabricVersion = '0.115.4+1.21.1'
def distantHorizonsApiVersion = '4.0.0'
def javaVersion = 21
def distantHorizonsRuntimePath = providers.gradleProperty('mc1211_distant_horizons_runtime_path').orNull
def meridianPath = providers.gradleProperty('mc1211_meridian_path')
		.getOrElse(rootProject.file('../meridian-1.21.1-Fabric-0.1.2.jar').path)
def meridianJar = file(meridianPath)
def meridianAvailable = meridianJar.exists()
if (!meridianAvailable) {
	logger.lifecycle("Meridian jar not found at ${meridianJar}; skipping Meridian integration sources. Set -Pmc1211_meridian_path=<jar> to enable.")
}

// Meridian is built with a newer Loom than this project uses, and Loom refuses to remap a mod jar
// stamped with a version ahead of its own. We only need the classes to compile against, so take a
// copy with that stamp removed. The mapping namespace is left alone so Loom still remaps
// intermediary to Mojang names correctly.
def meridianCompileJar = null
if (meridianAvailable) {
	meridianCompileJar = layout.buildDirectory.file('meridian/meridian-compile.jar').get().asFile
	if (!meridianCompileJar.exists() || meridianCompileJar.lastModified() < meridianJar.lastModified()) {
		meridianCompileJar.parentFile.mkdirs()
		def source = new java.util.zip.ZipFile(meridianJar)
		try {
			meridianCompileJar.withOutputStream { stream ->
				def archive = new java.util.zip.ZipOutputStream(stream)
				for (entry in source.entries()) {
					if (entry.isDirectory()) {
						continue
					}
					archive.putNextEntry(new java.util.zip.ZipEntry(entry.name))
					if (entry.name == 'META-INF/MANIFEST.MF') {
						def kept = source.getInputStream(entry).getText('UTF-8').readLines().findAll {
							!it.startsWith('Fabric-Loom-Version') && !it.startsWith('Fabric-Loom-Mixin-Remap-Type')
						}
						def eol = String.valueOf((char) 13) + String.valueOf((char) 10)
						archive.write((kept.join(eol) + eol + eol).getBytes('UTF-8'))
					} else {
						archive.write(source.getInputStream(entry).bytes)
					}
					archive.closeEntry()
				}
				archive.close()
			}
		} finally {
			source.close()
		}
	}
}

base {
	archivesName = "${rootProject.archives_base_name}-fabric-${minecraftVersion}"
}

configurations {
	bundledLibrary
}

tasks.withType(AbstractArchiveTask).configureEach {
	archiveVersion.set('')
}

repositories {
	mavenCentral()
	maven {
		url = 'https://api.modrinth.com/maven/'
		content {
			includeGroup 'maven.modrinth'
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		tellus {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

sourceSets {
	main {
		java {
			setSrcDirs([rootProject.file('src/main/java'), project.file('src/main/java')])
			if (!meridianAvailable) {
				exclude 'com/yucareux/tellus/integration/meridian/**'
				exclude 'com/yucareux/tellus/mixin/meridian/**'
			}
		}
		resources {
			setSrcDirs([rootProject.file('src/main/resources'), project.file('src/main/resources')])
			if (!meridianAvailable) {
				exclude 'tellus.meridian.mixins.json'
			}
		}
	}
	client {
		java {
			setSrcDirs([project.file('src/client/java')])
			if (!meridianAvailable) {
				exclude 'com/yucareux/tellus/integration/meridian/**'
				exclude 'com/yucareux/tellus/mixin/meridian/**'
			}
		}
		resources.setSrcDirs([project.file('src/client/resources')])
	}
	test {
		java.setSrcDirs([rootProject.file('src/test/java'), project.file('src/test/java')])
		resources.setSrcDirs([rootProject.file('src/test/resources'), project.file('src/test/resources')])
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraftVersion}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${loaderVersion}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricVersion}"

	bundledLibrary 'org.tukaani:xz:1.10'
	implementation 'org.tukaani:xz:1.10'
	implementation 'io.github.sebasbaumh:mapbox-vector-tile-java:24.1.1'
	include 'io.github.sebasbaumh:mapbox-vector-tile-java:24.1.1'
	implementation 'com.google.protobuf:protobuf-java:4.28.2'
	include 'com.google.protobuf:protobuf-java:4.28.2'

	testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
	testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'

	compileOnly "maven.modrinth:DistantHorizonsApi:${distantHorizonsApiVersion}"
	if (meridianAvailable) {
		modCompileOnly files(meridianCompileJar)
	}
	if (distantHorizonsRuntimePath) {
		runtimeOnly files(distantHorizonsRuntimePath)
	}
}

processResources {
	inputs.property 'version', project.version

	filesMatching('fabric.mod.json') {
		expand version: inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = javaVersion
}

tasks.named('test').configure {
	useJUnitPlatform()
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(javaVersion)
	}

	withSourcesJar()

	sourceCompatibility = JavaVersion.toVersion(javaVersion)
	targetCompatibility = JavaVersion.toVersion(javaVersion)
}

jar {
	inputs.property 'archivesName', project.base.archivesName

	from({
		configurations.bundledLibrary.collect { zipTree(it) }
	}) {
		exclude 'META-INF/MANIFEST.MF'
	}

	from(rootProject.file('LICENSE')) {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}

publishing {
	publications {
		create('mavenJava', MavenPublication) {
			artifactId = project.base.archivesName.get()
			from components.java
		}
	}

	repositories {
	}
}
